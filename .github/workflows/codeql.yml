name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-24.04
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - language: swift
            os: macos-26-intel
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # ARM 실행기 배정 장애 중에도 기존 ARM 전용 코드를 같은 SDK로 분석.
      - name: Build ARM64 app for analysis
        if: matrix.language == 'swift'
        run: swift build -c release --arch arm64

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
