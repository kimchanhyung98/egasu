name: Site CI

on:
  workflow_call:
    inputs:
      ref:
        description: "검증할 소스 ref"
        required: true
        type: string
    outputs:
      source_sha:
        description: "검증한 소스 커밋"
        value: ${{ jobs.verify.outputs.source_sha }}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'script/release_appcast.py'
      - 'Sources/Egasu/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/publish-site.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/pricing-supplement.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'script/release_appcast.py'
      - 'Sources/Egasu/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/publish-site.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/pricing-supplement.yml'

permissions:
  contents: read

jobs:
  verify:
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    concurrency:
      group: site-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      # site/package.json의 @playwright/test 버전과 함께 갱신.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: 조립 결과 검증
        run: ../script/site_assemble.sh
      - name: 검증한 소스 커밋 기록
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
        id: source
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-test-results
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
