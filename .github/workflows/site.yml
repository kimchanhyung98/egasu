name: Site CI

on:
  workflow_call:
    inputs:
      ref:
        description: "검증할 소스 ref"
        required: true
        type: string
    outputs:
      source_sha:
        description: "검증한 소스 커밋"
        value: ${{ jobs.verify.outputs.source_sha }}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'Sources/Egasu/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/publish-site.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/pricing-supplement.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'Sources/Egasu/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/publish-site.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/pricing-supplement.yml'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.lock.outputs.version }}
      source_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Playwright 버전 확인
        run: |
          version=$(node -p 'require("./site/package-lock.json").packages["node_modules/playwright-core"].version')
          [[ $version =~ ^[0-9][0-9A-Za-z.-]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: lock

  verify:
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    needs: playwright
    concurrency:
      group: site-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.playwright.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
      - name: 조립 결과 검증
        run: ../script/site_assemble.sh
      - name: 검증한 소스 커밋 기록
        run: |
          source_sha="$(git rev-parse HEAD)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
        id: source
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-test-results
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
