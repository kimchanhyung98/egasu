name: Site CI

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'Sources/Egasu/**'
      - '!Sources/Egasu/Resources/ProviderIcons/**'
      - '!Sources/Egasu/Resources/Localization/ko.lproj/*.strings'
      - '!Sources/Egasu/Resources/Localization/ja.lproj/*.strings'
      - '.github/workflows/site.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/pricing-supplement.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'script/site_*.sh'
      - 'Sources/Egasu/**'
      - '.github/workflows/site.yml'
      - '.github/workflows/publish-site.yml'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/pricing-supplement.yml'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Playwright 버전 확인
        run: |
          version=$(node -p 'require("./site/package-lock.json").packages["node_modules/playwright-core"].version')
          [[ $version =~ ^[0-9][0-9A-Za-z.-]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: lock

  verify:
    needs: playwright
    concurrency:
      group: site-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --init --ipc=host --user 1001
    defaults:
      run:
        shell: bash
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: 조립 결과 검증
        run: ../script/site_assemble.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-test-results
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7
