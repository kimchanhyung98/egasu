name: PR Title Check

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  pull-requests: read
  statuses: write

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check bot user
        id: bot-check
        env:
          PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [[ "$PR_USER_TYPE" == "Bot" ]]; then
            echo "✓ Bot user detected - skipping validation"
            echo "is_bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_bot=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: amannn/action-semantic-pull-request@v6
        if: steps.bot-check.outputs.is_bot != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # type·scope를 고정 목록으로 제한하지 않고 형식만 검증.
          types: |
            [a-z]+

          # scope는 선택 사항 — type: title과 type(scope): title 모두 허용.
          requireScope: false

          # 로컬 검증기와 같은 type(scope): text 구조 적용.
          headerPattern: '^([a-z]+)(?:\(([a-z0-9_-]+)\))?:\s+(\S.*)$'
          headerPatternCorrespondence: type, scope, subject

          # 작업 중인 PR 허용.
          wip: true

          # 아래 라벨이 있는 PR은 검증 생략.
          ignoreLabels: |
            bot
            ignore-semantic-pull-request

          # 제목 본문의 첫 글자가 영문 대문자이면 거부.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            does not start with an uppercase English character.
