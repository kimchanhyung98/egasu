# 버전 태그의 랜딩 페이지를 gh-pages에 게시한 뒤 Deploy Pages로 배포 연결.
# Release·가격표 게시와 같은 그룹으로 직렬화.
name: Publish landing page

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "게시할 버전 태그(예: v1.0.0-beta.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ inputs.tag || github.sha }}

  publish:
    needs: verify
    concurrency:
      group: release-appcast
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      PUBLICATION_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.source_sha }}
          fetch-depth: 0

      - name: 게시 태그 확인
        run: |
          source script/version.sh
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          egasu_release_version "$GITHUB_WORKSPACE" "$PUBLICATION_TAG"

      - name: 게시된 피드 기준값 기록
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          bash script/site_feed_snapshot.sh --allow-legacy-domain FETCH_HEAD > "$RUNNER_TEMP/site-feeds-before"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: 의존성 설치
        run: |
          cd site
          npm ci

      - name: 랜딩 페이지 조립
        run: |
          ./script/site_assemble.sh .build/site-preview "$(git rev-parse HEAD)"

      - name: gh-pages 브랜치에 랜딩 페이지 게시
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .build/site-preview
          keep_files: true
          # 새 사이트 도메인을 CNAME에 기록.
          cname: egasu.chanhyung.kim

      - name: 게시 전후 피드 불변 확인
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          bash script/site_feed_snapshot.sh FETCH_HEAD > "$RUNNER_TEMP/site-feeds-after"
          if ! cmp -s "$RUNNER_TEMP/site-feeds-before" "$RUNNER_TEMP/site-feeds-after"; then
            echo "::error::Published feeds changed during landing page publication."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pages-publication"
          git rev-parse FETCH_HEAD > "$RUNNER_TEMP/pages-publication/revision.txt"
          printf '%s\n' "$PUBLICATION_TAG" > "$RUNNER_TEMP/pages-publication/tag.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/pages-publication/source.txt"

      - name: 검증된 게시 커밋 전달
        uses: actions/upload-artifact@v7
        with:
          name: pages-publication-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-publication/
          if-no-files-found: error
