name: CI

on:
  # Swift 판 검증은 main에서 진행. 이전 Tauri 판은 tauri-legacy에 보관.
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    # ARM 실행기 배정 장애 동안 Intel에서 테스트하고 ARM64 앱·테스트도 교차 빌드.
    # ARM 실행기의 정상 배정이 확인되면 ARM64 네이티브 테스트로 복귀.
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Build ARM64 app and tests
        run: swift build --arch arm64 --build-tests

      - name: Build universal WidgetKit extension
        run: script/build_widget_extension.sh com.kimchanhyung98.openusage.dev 1.0 1 release "arm64 x86_64"

      - name: Run panel geometry tests
        id: panel_geometry
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter DashboardTabSwitchTests 2>&1 | tee "$RUNNER_TEMP/panel-geometry-tests.log"

      - name: Upload panel geometry failure log
        if: ${{ !cancelled() && steps.panel_geometry.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: panel-geometry-${{ github.run_attempt }}
          path: ${{ runner.temp }}/panel-geometry-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Run tests
        if: ${{ !cancelled() && (success() || steps.panel_geometry.outcome == 'failure') }}
        run: swift test
